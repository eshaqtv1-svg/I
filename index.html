<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIFA World Cup 2026 — Knockout Prediction Bracket</title>
<style>
  :root{
    --gold-1:#fde9b6;
    --gold-2:#f5d98b;
    --gold-3:#d4af37;
    --gold-4:#9c7a23;
    --bg:#07070a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .serif{font-family:Georgia,"Times New Roman",serif;}

  /* ambient background */
  .bg-glow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .bg-glow .a{position:absolute;top:-160px;left:22%;width:600px;height:600px;border-radius:50%;
    background:rgba(245,158,11,0.07);filter:blur(140px);}
  .bg-glow .b{position:absolute;top:30%;right:-130px;width:500px;height:500px;border-radius:50%;
    background:rgba(252,211,77,0.05);filter:blur(140px);}
  .bg-glow .dots{position:absolute;inset:0;opacity:0.035;
    background-image:radial-gradient(circle at 1px 1px, white 1px, transparent 0);
    background-size:26px 26px;}

  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:40px 18px 56px;}

  header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:36px;}
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.35em;color:rgba(252,211,77,.6);
    font-weight:600;margin-bottom:12px;}
  h1{font-size:34px;font-weight:900;letter-spacing:-0.01em;margin:0;
    background:linear-gradient(to bottom,var(--gold-1),var(--gold-2) 45%,var(--gold-4));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  @media(min-width:640px){h1{font-size:48px;}}
  .subtitle{margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.4);max-width:560px;}
  .rule{margin-top:20px;height:1px;width:160px;
    background:linear-gradient(to right,transparent,rgba(252,211,77,.5),transparent);}

  /* player selector */
  .players{display:flex;justify-content:center;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
  .player-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
    border-radius:18px;padding:16px 18px;min-width:110px;border:1px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.02);cursor:pointer;transition:all .25s ease;font:inherit;color:inherit;}
  .player-card:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.04);}
  .player-card.active{border-color:rgba(252,211,77,.6);
    background:linear-gradient(to bottom,rgba(245,158,11,.12),rgba(255,255,255,.02));
    box-shadow:0 0 30px rgba(252,211,77,.18);}
  .avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:800;color:rgba(0,0,0,.8);box-shadow:0 6px 16px rgba(0,0,0,.4);
    ring:2px;box-shadow:0 0 0 2px rgba(255,255,255,.1), 0 6px 16px rgba(0,0,0,.4);}
  .player-card.active .avatar{box-shadow:0 0 0 2px rgba(252,211,77,.7), 0 6px 16px rgba(0,0,0,.4);}
  .p-edris{background:linear-gradient(135deg,#fde68a,#d97706);}
  .p-ishaq{background:linear-gradient(135deg,#fda4af,#b91c1c);}
  .p-erfan{background:linear-gradient(135deg,#6ee7b7,#065f46);}
  .p-baba{background:linear-gradient(135deg,#7dd3fc,#1e40af);}
  .p-mahnaz{background:linear-gradient(135deg,#d8b4fe,#6b21a8);}
  .p-name{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.7);}
  .player-card.active .p-name{color:var(--gold-1);}
  .p-count{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.3);}
  .p-champ-badge{position:absolute;top:-8px;right:-8px;font-size:16px;
    filter:drop-shadow(0 0 6px rgba(252,211,77,.6));}

  .active-label{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;}
  .active-label .mini-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:rgba(0,0,0,.8);}
  .active-label .label-text{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);letter-spacing:.02em;}

  /* bracket */
  .bracket-shell{border-radius:20px;border:1px solid rgba(255,255,255,.07);
    background:linear-gradient(to bottom,rgba(255,255,255,.025),transparent);
    padding:18px 14px;overflow-x:auto;}
  @media(min-width:640px){.bracket-shell{padding:26px 22px;}}
  .bracket-inner{min-width:1180px;display:flex;align-items:center;justify-content:center;}

  .half{display:flex;align-items:stretch;}
  .half.right{flex-direction:row-reverse;}

  .col-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:rgba(252,211,77,.6);
    font-weight:600;margin-bottom:8px;}
  .col-label.right{text-align:right;}

  .col{display:flex;flex-direction:column;}
  .col-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px;}

  .match{display:flex;flex-direction:column;gap:4px;width:172px;}
  @media(min-width:640px){.match{width:186px;}}

  .slot{position:relative;display:flex;align-items:center;gap:10px;width:100%;border-radius:10px;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
    padding:8px 12px;cursor:pointer;transition:all .18s ease;font:inherit;color:inherit;text-align:left;}
  .slot:hover:not(.disabled):not(.empty){border-color:rgba(252,211,77,.4);background:rgba(255,255,255,.06);}
  .slot.right{flex-direction:row-reverse;text-align:right;}
  .slot.empty{border-color:rgba(255,255,255,.06);background:rgba(255,255,255,.02);cursor:default;}
  .slot.disabled{cursor:default;}
  .slot.selected{border-color:rgba(251,191,36,.6);
    background:linear-gradient(to right,rgba(251,191,36,.15),transparent);
    box-shadow:0 0 12px rgba(251,191,36,.18);}
  .slot.right.selected{background:linear-gradient(to left,rgba(251,191,36,.15),transparent);}

  .flag-circle{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
  .team-name{flex:1;font-size:12.5px;font-weight:500;letter-spacing:.01em;color:rgba(255,255,255,.7);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot.selected .team-name{color:var(--gold-1);}
  .slot.empty .team-name{color:rgba(255,255,255,.2);font-style:italic;}
  .check{flex-shrink:0;color:var(--gold-2);}
  .slot.right .check{order:-1;}

  /* connectors */
  .connector{width:28px;display:flex;flex-direction:column;justify-content:space-around;padding:10px 0;}
  .connector-seg{flex:1;position:relative;}
  .connector-seg svg{width:100%;height:100%;display:block;overflow:visible;}

  /* final / champion center */
  .final-center{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 12px;gap:18px;min-width:200px;}
  @media(min-width:640px){.final-center{padding:0 26px;}}
  .final-match{display:flex;flex-direction:column;gap:6px;width:180px;}

  .trophy-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px;}
  .trophy-glow{position:absolute;inset:0;border-radius:50%;background:rgba(251,191,36,.15);
    filter:blur(24px);transform:scale(1.5);}
  .trophy-circle{position:relative;width:68px;height:68px;border-radius:50%;
    background:linear-gradient(to bottom,#fde68a,#f59e0b 55%,#92400e);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 35px rgba(251,191,36,.45);box-shadow:0 0 0 1px rgba(253,230,138,.5),0 0 35px rgba(251,191,36,.45);}
  @media(min-width:640px){.trophy-circle{width:80px;height:80px;}}

  .champion-box{min-width:150px;border-radius:14px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.02);padding:10px 16px;display:flex;align-items:center;justify-content:center;
    gap:8px;transition:all .3s ease;}
  .champion-box.filled{border-color:rgba(252,211,77,.7);
    background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(146,64,14,.1));
    box-shadow:0 0 24px rgba(251,191,36,.3);}
  .champion-box .flag-big{font-size:21px;}
  .champion-box .name{font-size:13.5px;font-weight:700;color:var(--gold-1);letter-spacing:.01em;}
  .champion-box .placeholder{font-size:12px;color:rgba(255,255,255,.25);font-style:italic;}

  /* progress */
  .progress-row{display:flex;align-items:center;gap:12px;margin-top:20px;padding:0 4px;}
  .progress-track{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;}
  .progress-fill{height:100%;border-radius:4px;background:linear-gradient(to right,#fbbf24,#fde68a);
    transition:width .4s ease;}
  .progress-pct{font-size:10px;color:rgba(255,255,255,.35);font-weight:600;letter-spacing:.02em;white-space:nowrap;}

  footer{margin-top:38px;text-align:center;font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.01em;}

  ::-webkit-scrollbar{height:8px;}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,.03);}
  ::-webkit-scrollbar-thumb{background:rgba(252,211,77,.25);border-radius:8px;}
</style>
</head>
<body>

<div class="bg-glow"><div class="a"></div><div class="b"></div><div class="dots"></div></div>

<div class="wrap">
  <header>
    <div class="eyebrow">FIFA World Cup 2026 · Canada · Mexico · USA</div>
    <h1 class="serif">Knockout Prediction Bracket</h1>
    <p class="subtitle">Official Round of 32 fixtures. Five independent brackets. One champion per prophecy.</p>
    <div class="rule"></div>
  </header>

  <div class="players" id="players"></div>

  <div class="active-label" id="activeLabel"></div>

  <div class="bracket-shell">
    <div class="bracket-inner" id="bracketInner"></div>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span class="progress-pct" id="progressPct">0% complete</span>
  </div>

  <footer>Tap any team to advance them · Changing a pick clears later rounds for that path</footer>
</div>

<script>
/* ---------------------------------------------------------------
   DATA — FIFA WORLD CUP 2026, OFFICIAL ROUND OF 32 FIXTURES
   --------------------------------------------------------------- */
const FLAG = {
  RSA:"🇿🇦", CAN:"🇨🇦", BRA:"🇧🇷", JPN:"🇯🇵",
  GER:"🇩🇪", PAR:"🇵🇾", NED:"🇳🇱", MAR:"🇲🇦",
  CIV:"🇨🇮", NOR:"🇳🇴", FRA:"🇫🇷", SWE:"🇸🇪",
  MEX:"🇲🇽", ECU:"🇪🇨", ENG:"🏴", COD:"🇨🇩",
  BEL:"🇧🇪", SEN:"🇸🇳", USA:"🇺🇸", BIH:"🇧🇦",
  ESP:"🇪🇸", AUT:"🇦🇹", POR:"🇵🇹", CRO:"🇭🇷",
  SUI:"🇨🇭", ALG:"🇩🇿", AUS:"🇦🇺", EGY:"🇪🇬",
  ARG:"🇦🇷", CPV:"🇨🇻", COL:"🇨🇴", GHA:"🇬🇭",
};
const T = (code, name) => ({ code, name, flag: FLAG[code] });

const R32 = [
  [T("GER","Germany"), T("PAR","Paraguay")],
  [T("FRA","France"), T("SWE","Sweden")],
  [T("RSA","South Africa"), T("CAN","Canada")],
  [T("NED","Netherlands"), T("MAR","Morocco")],
  [T("POR","Portugal"), T("CRO","Croatia")],
  [T("ESP","Spain"), T("AUT","Austria")],
  [T("USA","United States"), T("BIH","Bosnia & Herzegovina")],
  [T("BEL","Belgium"), T("SEN","Senegal")],
  [T("JPN","Japan"), T("BRA","Brazil")],
  [T("NOR","Norway"), T("CIV","Côte d'Ivoire")],
  [T("ECU","Ecuador"), T("MEX","Mexico")],
  [T("ENG","England"), T("COD","DR Congo")],
  [T("ARG","Argentina"), T("CPV","Cabo Verde")],
  [T("AUS","Australia"), T("EGY","Egypt")],
  [T("SUI","Switzerland"), T("ALG","Algeria")],
  [T("COL","Colombia"), T("GHA","Ghana")],
];

const PLAYERS = [
  { id:"edris",  name:"Edris",  initial:"E",  cls:"p-edris"  },
  { id:"ishaq",  name:"Ishaq",  initial:"I",  cls:"p-ishaq"  },
  { id:"erfan",  name:"Erfan",  initial:"Er", cls:"p-erfan"  },
  { id:"baba",   name:"BaBa",   initial:"B",  cls:"p-baba"   },
  { id:"mahnaz", name:"Mahnaz", initial:"M",  cls:"p-mahnaz" },
];

/* ---------------------------------------------------------------
   STATE
   --------------------------------------------------------------- */
let allPicks = {};
PLAYERS.forEach(p => allPicks[p.id] = {0:{},1:{},2:{},3:{},4:{}});
let activePlayer = PLAYERS[0].id;

/* ---------------------------------------------------------------
   BRACKET ENGINE
   --------------------------------------------------------------- */
function buildRounds(picks){
  const rounds = [ R32.map((teams,i) => ({ teams, winner: picks[0][i] })) ];
  for (let r=1; r<5; r++){
    const prev = rounds[r-1];
    const matches = [];
    for (let i=0; i<prev.length; i+=2){
      const a = prev[i], b = prev[i+1];
      const teamA = a.winner ? a.teams.find(t=>t.code===a.winner) : null;
      const teamB = b.winner ? b.teams.find(t=>t.code===b.winner) : null;
      matches.push({ teams:[teamA, teamB], winner: picks[r][matches.length] });
    }
    rounds.push(matches);
  }
  return rounds;
}

function setPick(round, matchIndex, code){
  const picks = allPicks[activePlayer];
  picks[round][matchIndex] = code;
  for (let r=round+1; r<5; r++) picks[r] = {};
  render();
}

function countPicked(picks){
  let n=0;
  for (let r=0;r<5;r++){ Object.values(picks[r]).forEach(v=>{ if(v) n++; }); }
  return n;
}

function championOf(pid){
  const rounds = buildRounds(allPicks[pid]);
  const f = rounds[4][0];
  return f.winner ? f.teams.find(t=>t.code===f.winner) : null;
}

/* ---------------------------------------------------------------
   RENDER HELPERS
   --------------------------------------------------------------- */
function slotHTML(team, selected, disabled, side, round, matchIndex){
  const empty = !team;
  const classes = ["slot"];
  if (side==="right") classes.push("right");
  if (empty) classes.push("empty");
  else if (disabled) classes.push("disabled");
  if (selected && !empty) classes.push("selected");

  const checkSvg = `<svg class="check" width="13" height="13" viewBox="0 0 20 20" fill="none">
      <path d="M4 10.5L8 14.5L16 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;

  const clickAttr = (!empty && !disabled)
    ? `data-round="${round}" data-match="${matchIndex}" data-code="${team.code}"`
    : "";

  return `<button class="${classes.join(' ')}" ${clickAttr} ${empty||disabled ? "" : ""}>
      <span class="flag-circle">${empty ? "" : team.flag}</span>
      <span class="team-name">${empty ? "TBD" : team.name}</span>
      ${(selected && !empty) ? checkSvg : ""}
    </button>`;
}

function matchHTML(m, side, round, matchIndex){
  const [a,b] = m.teams;
  const bothKnown = !!(a && b);
  return `<div class="match">
      ${slotHTML(a, m.winner===(a&&a.code), !bothKnown, side, round, matchIndex)}
      ${slotHTML(b, m.winner===(b&&b.code), !bothKnown, side, round, matchIndex)}
    </div>`;
}

function connectorHTML(count, side){
  let segs = "";
  for (let i=0;i<count;i++){
    const path = side==="left"
      ? `M0,${i%2===0?25:75} H14 V50 H28`
      : `M28,${i%2===0?25:75} H14 V50 H0`;
    segs += `<div class="connector-seg">
        <svg viewBox="0 0 28 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="g-${side}-${i}-${round_seed++}" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#d4af37" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#f5d98b" stop-opacity="0.85"/>
            </linearGradient>
          </defs>
          <path d="${path}" fill="none" stroke="url(#g-${side}-${i}-${round_seed-1})" stroke-width="1.4"/>
        </svg>
      </div>`;
  }
  return `<div class="connector">${segs}</div>`;
}
let round_seed = 0;

function columnHTML(matches, label, side, roundGlobalIndex, indexOffset){
  const rows = matches.map((m, idx) => matchHTML(m, side, roundGlobalIndex, idx+indexOffset)).join("");
  return `<div class="col">
      <div class="col-label ${side==='right'?'right':''}">${label}</div>
      <div class="col-matches">${rows}</div>
    </div>`;
}

function halfHTML(rounds, side, offsets){
  const labels = ["Round of 32","Round of 16","Quarter-Finals","Semi-Final"];
  let pieces = [];
  rounds.forEach((matches, i) => {
    pieces.push(columnHTML(matches, labels[i], side, i, offsets[i]));
    if (i < rounds.length-1){
      pieces.push(connectorHTML(matches.length/2, side));
    }
  });
  if (side === "right") pieces = pieces.reverse();
  return `<div class="half ${side==='right'?'right':''}">${pieces.join("")}</div>`;
}

function finalCenterHTML(finalMatch, champion){
  const [a,b] = finalMatch.teams;
  const bothKnown = !!(a && b);
  const championBoxClass = champion ? "champion-box filled" : "champion-box";
  const championInner = champion
    ? `<span class="flag-big">${champion.flag}</span><span class="name">${champion.name}</span>`
    : `<span class="placeholder">Awaiting Final</span>`;

  return `<div class="final-center">
      <div class="col-label">Final</div>
      <div class="final-match">
        ${slotHTML(a, finalMatch.winner===(a&&a.code), !bothKnown, "left", 4, 0)}
        ${slotHTML(b, finalMatch.winner===(b&&b.code), !bothKnown, "left", 4, 0)}
      </div>
      <div class="trophy-wrap">
        <div class="trophy-glow"></div>
        <div class="trophy-circle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M5 4h14v3a4 4 0 0 1-4 4h-.17A4.5 4.5 0 0 1 13 14.8V17h2a1 1 0 0 1 1 1v1H8v-1a1 1 0 0 1 1-1h2v-2.2A4.5 4.5 0 0 1 9.17 11H9a4 4 0 0 1-4-4V4Z" fill="#3b2410"/>
            <path d="M5 4H2v2a3 3 0 0 0 3 3" stroke="#3b2410" stroke-width="1.2" fill="none"/>
            <path d="M19 4h3v2a3 3 0 0 1-3 3" stroke="#3b2410" stroke-width="1.2" fill="none"/>
          </svg>
        </div>
        <div class="col-label" style="margin-bottom:0;">Champion</div>
        <div class="${championBoxClass}">${championInner}</div>
      </div>
    </div>`;
}

/* ---------------------------------------------------------------
   MAIN RENDER
   --------------------------------------------------------------- */
function render(){
  const picks = allPicks[activePlayer];
  const rounds = buildRounds(picks);

  // PLAYERS BAR
  const playersEl = document.getElementById("players");
  playersEl.innerHTML = PLAYERS.map(p => {
    const champ = championOf(p.id);
    const count = countPicked(allPicks[p.id]);
    const active = p.id === activePlayer;
    return `<button class="player-card ${active?'active':''}" data-player="${p.id}">
        <div class="avatar ${p.cls}">${p.initial}</div>
        <span class="p-name">${p.name}</span>
        <span class="p-count">${count}/31 picked</span>
        ${champ ? `<span class="p-champ-badge">${champ.flag}</span>` : ""}
      </button>`;
  }).join("");

  // ACTIVE LABEL
  const current = PLAYERS.find(p=>p.id===activePlayer);
  document.getElementById("activeLabel").innerHTML =
    `<span class="mini-avatar ${current.cls}">${current.initial}</span>
     <span class="label-text">${current.name}'s Bracket</span>`;

  // BRACKET
  const leftRounds = [
    rounds[0].slice(0,8),
    rounds[1].slice(0,4),
    rounds[2].slice(0,2),
    rounds[3].slice(0,1),
  ];
  const rightRounds = [
    rounds[0].slice(8,16),
    rounds[1].slice(4,8),
    rounds[2].slice(2,4),
    rounds[3].slice(1,2),
  ];
  const leftOffsets  = [0,0,0,0];
  const rightOffsets = [8,4,2,1];

  document.getElementById("bracketInner").innerHTML =
    halfHTML(leftRounds, "left", leftOffsets) +
    finalCenterHTML(rounds[4][0], championOf(activePlayer)) +
    halfHTML(rightRounds, "right", rightOffsets);

  // PROGRESS
  const filled = countPicked(picks);
  const pct = Math.round((filled/31)*100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressPct").textContent = pct + "% complete";

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll(".player-card").forEach(btn => {
    btn.onclick = () => { activePlayer = btn.getAttribute("data-player"); render(); };
  });
  document.querySelectorAll(".slot[data-round]").forEach(btn => {
    btn.onclick = () => {
      const round = parseInt(btn.getAttribute("data-round"),10);
      const match = parseInt(btn.getAttribute("data-match"),10);
      const code = btn.getAttribute("data-code");
      setPick(round, match, code);
    };
  });
}

render();
</script>
</body>
</html>
